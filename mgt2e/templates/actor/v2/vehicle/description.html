<section class="tab {{tab.cssClass}}" data-group="primary" data-tab="description">
    <img class="item-img actor-draggable draggable" src="{{actor.img}}"
         data-action="editImage" data-field="img"
         data-actor-id="{{actor._id}}"/>

    <prose-mirror name="system.description"
                  data-document-uuid="{{actor.uuid}}"
                  value="{{system.description}}"
                  collaborative="false"
                  toggled="true">
        {{{enrichedDescription}}}
    </prose-mirror>
</section>
