
{{#if (ifEquals system.software.class "personal")}}
    <div class="shadow">
        <h2>{{localize "MGT2.Effects.SoftwareEffects"}}</h2>

        <select name="system.software.type">
            {{selectOptions SOFTWARE_TYPE selected=system.software.type}}
        </select>

        {{#unless (ifEquals system.software.type "generic")}}
            <select name="system.software.skill">
                {{selectOptions AGENT_SKILLS selected=system.software.skill}}
            </select>
            {{#if (ifEquals system.software.type "expert")}}
                <select name="system.software.skillLevel">
                    {{selectOptions EXPERT_LEVELS selected=system.software.skillLevel}}
                </select>
            {{else}}
                <select name="system.software.skillLevel">
                    {{selectOptions TASK_LEVELS selected=system.software.skillLevel}}
                </select>
            {{/if}}
        {{/unless}}
    </div>
{{/if}}

{{#if (ifEquals system.software.class "data")}}
    <div class="shadow">
        <div class="resources grid grid-2col flex-group-left">
            <div class="resource">
                <label>{{localize "MGT2.Item.MessageFrom"}}</label>
                <input class="writable" type="text"
                       name="system.software.messageFrom"
                       value="{{system.software.messageFrom}}"/>
            </div>
            <div class="resource">
                <label>{{localize "MGT2.Item.MessageTo"}}</label>
                <input class="writable" type="text"
                       name="system.software.messageTo"
                       value="{{system.software.messageTo}}"/>
            </div>
        </div>
    </div>
{{/if}}
