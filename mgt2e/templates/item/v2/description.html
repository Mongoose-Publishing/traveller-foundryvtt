<section class="tab {{tab.cssClass}} scrollable" data-group="primary" data-tab="description">
    <img class="item-img"src="{{item.img}}" data-action="editImage" data-field="img"/>
    <prose-mirror name="system.description"
                  data-document-uuid="{{item.uuid}}"
                  value="{{system.description}}"
                  collaborative="false"
                  toggled="true">
        {{{enrichedDescription}}}
    </prose-mirror>
</section>
